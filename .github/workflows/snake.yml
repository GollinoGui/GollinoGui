name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # roda todo dia à meia-noite (UTC)
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake game from a GitHub contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: GollinoGui
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2339D353&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
